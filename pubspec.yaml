name: pawnder
description: "Pawnder: community app for reporting, rescuing and adopting stray animals."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  http: ^1.2.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  supabase_flutter: ^2.18.3
  android_intent_plus: ^6.1.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:

  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/background.png
    - assets/home_banner.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/pawnder_app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/pawnder_app_logo.png"