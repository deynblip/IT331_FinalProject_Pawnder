name: pawnder
description: "Pawnder: community app for reporting, rescuing and adopting stray animals."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  http: ^1.2.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/background.png
    - assets/home_banner.png
    - assets/images/